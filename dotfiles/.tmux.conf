# Prefix
unbind-key C-b
set-option -g prefix C-a

# Splits
bind-key | split-window -h
bind-key - split-window -v

# Pane navigation
bind-key -n M-i select-pane -U
bind-key -n M-j select-pane -L
bind-key -n M-k select-pane -D
bind-key -n M-l select-pane -R
bind-key -n M-\; select-pane -l

bind-key -T copy-mode-vi M-i select-pane -U
bind-key -T copy-mode-vi M-j select-pane -L
bind-key -T copy-mode-vi M-k select-pane -D
bind-key -T copy-mode-vi M-l select-pane -R
bind-key -T copy-mode-vi M-\; select-pane -l

# Pane resize
bind-key -n M-I resize-pane -U
bind-key -n M-J resize-pane -L
bind-key -n M-K resize-pane -D
bind-key -n M-L resize-pane -R

set -g mouse on
set -sg escape-time 16

# Status line
# ----------------------------------------------------------------------------
set -g status-bg colour0
set -g status-fg colour15
set -g window-status-current-style "bg=colour0,fg=colour12,bold"
set -g status-interval 60
set -g status-left-length 32
set -g status-right-length 64

user='#[fg=colour13]#(whoami)#[default]'
host='#[fg=colour9]#H#[default]'
time='%Y-%m-%d %H:%M'

set -g status-left " [#S] "
set -g status-right " $user@$host $time "

if-shell 'test -n "$SSH_CLIENT"' 'source-file ~/.tmux.remote.conf'

# F2: toggle key bindings off (for nested tmux)
bind -T root F2 \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=colour0,fg=colour8" \;\
    set window-status-current-style "bg=colour0,fg=colour8" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F2 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u window-status-current-style \;\
    refresh-client -S
